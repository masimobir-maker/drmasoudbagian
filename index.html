<style>
:root{--bg:#eef2f4;--cd:#fff;--ink:#10233a;--mut:#667789;--ln:#dbe3ea;--ac:#0f766e;--in:#15803d;--out:#b91c1c;--hero:#10233a;--gold:#e3b23c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141d;--cd:#13202c;--ink:#e8eef3;--mut:#8fa1b3;--ln:#223445;--ac:#2dd4bf;--in:#4ade80;--out:#f87171;--hero:#17324a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b141d;--cd:#13202c;--ink:#e8eef3;--mut:#8fa1b3;--ln:#223445;--ac:#2dd4bf;--in:#4ade80;--out:#f87171;--hero:#17324a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif;padding-bottom:110px}
header{padding:16px 18px 6px;display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:11px;border:1px solid var(--ln);background:#fff}
header h1{margin:0;font-size:19px;font-weight:800}
header small{color:var(--mut);font-size:12px}
main{padding:8px 14px;max-width:560px;margin:auto}
.hero{background:var(--hero);color:#fff;border-radius:18px;padding:20px 18px;margin:8px 0 14px;background-image:repeating-linear-gradient(transparent 0 27px,rgba(255,255,255,.07) 27px 28px)}
.hero small{opacity:.75}.hero .big{font-size:34px;font-weight:800;line-height:1.3}
.hero .two{display:flex;gap:10px;margin-top:12px}
.hero .two div{flex:1;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px}
.hero b{display:block;font-size:16px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:6px 14px;margin:0 0 14px}
h2{font-size:15px;margin:18px 2px 8px;font-weight:800}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}.row>div{flex:1;min-width:0}
.row b{display:block;font-weight:600}.row small{display:block;color:var(--mut);font-size:12px;line-height:1.5}
.amt{font-weight:800;white-space:nowrap}.amt.in,.in{color:var(--in)}.amt.out,.out{color:var(--out)}
.x{border:0;background:none;color:var(--mut);font-size:20px;padding:4px 8px;font-family:inherit}
.empty{color:var(--mut);text-align:center;padding:22px 0}
nav{position:fixed;inset:auto 0 0 0;background:var(--cd);border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px Vazirmatn,Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0}
nav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--ac)}nav button.on i{filter:none;opacity:1}
.fab{position:fixed;left:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--gold);color:#10233a;font-size:30px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.chips{display:flex;gap:8px;margin:8px 0}
.chips button,.seg button{border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:20px;padding:4px 14px;font:inherit}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;margin:2px 0 10px}
label{font-size:12px;color:var(--mut)}
.pri,.sec{width:100%;border:0;border-radius:12px;padding:12px;font:600 15px Vazirmatn,Tahoma,sans-serif;margin-top:4px}
.pri{background:var(--ac);color:#fff}.sec{background:var(--bg);color:var(--ink);border:1px solid var(--ln)}
.dual{display:flex;gap:8px}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1;border-radius:10px;padding:8px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#sh{position:fixed;inset:0;z-index:20}
#sh .bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sh .pn{position:absolute;inset:auto 0 0 0;max-height:88%;overflow:auto;background:var(--cd);border-radius:20px 20px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto}
.gr{width:40px;height:4px;border-radius:4px;background:var(--ln);margin:0 auto 8px}
.pn h3{margin:4px 0 12px}
.bar{height:8px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ac)}
.sc{overflow-x:auto}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:30;font-size:13px}
.cr{text-align:center;color:var(--mut);font-size:12px;margin:22px 0}
</style>
</head>
<body>
<header><img id="lg" alt="" width="44" height="44"><div><h1>حسابداری با مسعود آیفیکس</h1><small>طراح: مسعود بگیان</small></div></header>
<main id="app"></main>
<button class="fab" onclick="txForm('out')" aria-label="تراکنش جدید">+</button>
<nav id="nv"></nav>
<div id="sh" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>+String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[,٬،\s]/g,'')||0;
const f=n=>Math.round(Math.abs(n)).toLocaleString('fa-IR');
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dfa=new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium'}),D=s=>dfa.format(new Date(s+'T12:00:00'));
const mf=new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{year:'numeric',month:'numeric'});
const mk=s=>{const p=mf.formatToParts(new Date(s+'T12:00:00')),g=t=>(p.find(x=>x.type==t)||{}).value;return (g('year')||g('relatedYear'))+'/'+String(g('month')).padStart(2,'0')};
const mname=s=>new Intl.DateTimeFormat('fa-IR',{month:'long'}).format(new Date(s+'T12:00:00'));
const CO=['خوراک','حمل‌ونقل','قبوض','اجاره','سلامت','خرید','تفریح','سایر'],CI=['حقوق','فروش','سود','سایر'];
const KEY='masoud-ifix-accounting';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{tx:[],pt:[],ppl:[],acc:[{id:1,n:'صندوق نقد',b:0},{id:2,n:'حساب بانکی',b:0}],u:'تومان'};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('حافظه پر است؛ از عکس‌های کوچک‌تر استفاده کنید');return false}};
const U=()=>S.u||'تومان',uid=()=>Date.now()+Math.floor(Math.random()*1e3);
let tab='home',flt='all',q='';
try{const t=localStorage.getItem('masoud-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const accBal=a=>a.b+S.tx.filter(t=>t.acc==a.id).reduce((s,t)=>s+(t.t=='in'?t.a:-t.a),0);
const pBal=p=>S.pt.filter(x=>x.p==p.id).reduce((s,x)=>s+(x.t=='give'?x.a:-x.a),0);
const accN=id=>(S.acc.find(a=>a.id==id)||{n:'حذف‌شده'}).n;
function toast(m){const e=document.createElement('div');e.id='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),1800)}
function sheet(t,h){$('#sh').innerHTML=`<div class="bd" onclick="closeSh()"></div><div class="pn"><div class="gr"></div><h3>${t}</h3>${h}</div>`;$('#sh').hidden=false}
const closeSh=()=>{$('#sh').hidden=true};
function ask(m,fn){sheet(m,`<div class="dual"><button class="sec" onclick="closeSh()">انصراف</button><button class="pri" style="background:var(--out)" onclick="${fn};closeSh()">تأیید حذف</button></div>`)}
const NAV=[['home','🏠','خانه'],['tx','💸','تراکنش‌ها'],['ppl','👥','اشخاص'],['rep','📊','گزارش'],['set','⚙️','تنظیمات']];
function go(t){tab=t;render();scrollTo(0,0)}
function render(){
 $('#nv').innerHTML=NAV.map(n=>`<button class="${tab==n[0]?'on':''}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('');
 $('#app').innerHTML={home:vHome,tx:vTx,ppl:vPpl,rep:vRep,set:vSet}[tab]();
}
const row=t=>`<div class="row"><div><b>${esc(t.c)}</b><small>${D(t.d)}</small><small>${esc(accN(t.acc))}${t.n?' – '+esc(t.n):''}</small></div><span class="amt ${t.t}">${t.t=='in'?'+':'−'}${f(t.a)}</span><button class="x" onclick="ask('این تراکنش حذف شود؟','delTx(${t.id})')" aria-label="حذف">×</button></div>`;
const sorted=()=>[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
function vHome(){
 const k=mk(today()),m=S.tx.filter(t=>mk(t.d)==k),inc=m.filter(t=>t.t=='in').reduce((s,t)=>s+t.a,0),exp=m.filter(t=>t.t=='out').reduce((s,t)=>s+t.a,0);
 const tot=S.acc.reduce((s,a)=>s+accBal(a),0),bs=S.ppl.map(pBal),rec=bs.filter(x=>x>0).reduce((a,b)=>a+b,0),owe=-bs.filter(x=>x<0).reduce((a,b)=>a+b,0);
 return `<div class="hero"><small>موجودی کل</small><div class="big">${tot<0?'−':''}${f(tot)} <small>${U()}</small></div>
 <div class="two"><div><small>درآمد ${mname(today())}</small><b>${f(inc)}</b></div><div><small>هزینه ${mname(today())}</small><b>${f(exp)}</b></div></div></div>
 <h2>حساب‌ها</h2><div class="card">${S.acc.map(a=>`<div class="row"><div><b>${esc(a.n)}</b></div><span class="amt ${accBal(a)<0?'out':''}">${accBal(a)<0?'−':''}${f(accBal(a))}</span></div>`).join('')||'<div class="empty">حسابی ندارید</div>'}</div>
 <h2>طلب و بدهی</h2><div class="card"><div class="row"><div><b>طلب شما از دیگران</b></div><span class="amt in">${f(rec)}</span></div><div class="row"><div><b>بدهی شما به دیگران</b></div><span class="amt out">${f(owe)}</span></div></div>
 <h2>آخرین تراکنش‌ها</h2><div class="card">${sorted().slice(0,5).map(row).join('')||'<div class="empty">هنوز تراکنشی ثبت نشده. با دکمه + اولین مورد را اضافه کنید.</div>'}</div>
 <div class="cr">طراح: مسعود بگیان</div>`}
function list(){const r=sorted().filter(t=>(flt=='all'||t.t==flt)&&(!q||(t.c+(t.n||'')).includes(q)));return r.map(row).join('')||'<div class="empty">موردی پیدا نشد</div>'}
function vTx(){return `<h2>تراکنش‌ها</h2><input placeholder="جستجو در دسته و توضیح" value="${esc(q)}" oninput="q=this.value;$('#lst').innerHTML=list()">
 <div class="chips">${[['all','همه'],['in','درآمد'],['out','هزینه']].map(c=>`<button class="${flt==c[0]?'on':''}" onclick="flt='${c[0]}';render()">${c[1]}</button>`).join('')}</div><div class="card" id="lst">${list()}</div>`}
function vPpl(){return `<h2>اشخاص (طلب و بدهی)</h2><div class="card">${S.ppl.map(p=>{const b=pBal(p);return `<div class="row" onclick="pSheet(${p.id})"><div><b>${esc(p.n)}</b><small>${b>0?'بدهکار به شما':b<0?'طلبکار از شما':'تسویه'}</small></div><span class="amt ${b>0?'in':b<0?'out':''}">${f(b)}</span></div>`}).join('')||'<div class="empty">شخصی اضافه نشده</div>'}</div><button class="pri" onclick="pForm()">افزودن شخص</button>`}
function vRep(){
 const ks={};S.tx.forEach(t=>ks[mk(t.d)]=ks[mk(t.d)]||t.d);ks[mk(today())]=ks[mk(today())]||today();
 const data=Object.keys(ks).sort().slice(-6).map(k=>{const m=S.tx.filter(t=>mk(t.d)==k);return{n:mname(ks[k]),i:m.filter(t=>t.t=='in').reduce((s,t)=>s+t.a,0),o:m.filter(t=>t.t=='out').reduce((s,t)=>s+t.a,0)}});
 const mx=Math.max(1,...data.flatMap(d=>[d.i,d.o])),w=340/data.length;
 const svg=data.map((d,i)=>{const x=340-(i+.5)*w,hi=d.i/mx*100,ho=d.o/mx*100;return `<rect x="${x-15}" y="${120-hi}" width="14" height="${hi}" rx="3" fill="var(--in)"/><rect x="${x+1}" y="${120-ho}" width="14" height="${ho}" rx="3" fill="var(--out)"/><text x="${x}" y="140" text-anchor="middle" font-size="11" fill="var(--mut)">${d.n}</text>`}).join('');
 const k=mk(today()),cat={};S.tx.filter(t=>t.t=='out'&&mk(t.d)==k).forEach(t=>cat[t.c]=(cat[t.c]||0)+t.a);
 const cs=Object.entries(cat).sort((a,b)=>b[1]-a[1]),ct=cs.reduce((s,c)=>s+c[1],0)||1;
 return `<h2>درآمد و هزینه ماهانه</h2><div class="card sc"><svg viewBox="0 0 340 150" width="100%" role="img" aria-label="نمودار"><line x1="0" x2="340" y1="120" y2="120" stroke="var(--ln)"/>${svg}</svg><small style="color:var(--mut)"><span class="in">■</span> درآمد &nbsp; <span class="out">■</span> هزینه</small></div>
 <h2>هزینه‌های ${mname(today())} به تفکیک دسته</h2><div class="card">${cs.map(c=>`<div class="row"><div><b>${esc(c[0])}</b><div class="bar"><i style="width:${c[1]/ct*100}%"></i></div></div><span class="amt">${f(c[1])}</span></div>`).join('')||'<div class="empty">این ماه هزینه‌ای ثبت نشده</div>'}</div>`}
function vSet(){return `<h2>حساب‌ها</h2><div class="card">${S.acc.map(a=>`<div class="row"><div><b>${esc(a.n)}</b></div><span class="amt">${f(accBal(a))}</span><button class="x" onclick="ask('حساب و تراکنش‌های آن حذف شود؟','delAcc(${a.id})')">×</button></div>`).join('')}</div><button class="sec" onclick="accForm()">افزودن حساب</button>
 <h2>ظاهر و واحد پول</h2><div class="dual"><button class="sec" onclick="theme()">تغییر حالت تاریک/روشن</button><button class="sec" onclick="S.u=U()=='تومان'?'ریال':'تومان';save();render()">واحد: ${U()}</button></div>
 <h2>پشتیبان‌گیری</h2><button class="sec" onclick="bk()">پشتیبان و بازیابی اطلاعات</button>
 <h2>نصب روی گوشی</h2><div class="card"><small style="color:var(--mut)">آیفون: در Safari دکمه اشتراک‌گذاری، سپس «افزودن به صفحه اصلی».<br>اندروید: در Chrome منوی سه‌نقطه، سپس «افزودن به صفحه اصلی».</small></div>
 <button class="sec" style="color:var(--out)" onclick="ask('همه اطلاعات پاک شود؟','reset()')">پاک‌کردن همه اطلاعات</button>
 <div class="cr">حسابداری با مسعود آیفیکس<br>طراح: مسعود بگیان</div>`}
function txForm(t){if(!S.acc.length){toast('ابتدا یک حساب بسازید');go('set');return}
 const keep=$('#fa')?$('#fa').value:'';
 sheet('ثبت تراکنش جدید',`<div class="seg"><button class="${t=='out'?'on':''}" onclick="txForm('out')">هزینه</button><button class="${t=='in'?'on':''}" onclick="txForm('in')">درآمد</button></div>
 <label>مبلغ (${U()})</label><input id="fa" inputmode="numeric" placeholder="۰" value="${esc(keep)}"><label>دسته‌بندی</label><select id="fc">${(t=='in'?CI:CO).map(c=>`<option>${c}</option>`).join('')}</select>
 <label>حساب</label><select id="fb">${S.acc.map(a=>`<option value="${a.id}">${esc(a.n)}</option>`).join('')}</select><label>تاریخ</label><input id="fd" type="date" value="${today()}"><label>توضیح</label><input id="fn" placeholder="اختیاری">
 <button class="pri" onclick="saveTx('${t}')">ذخیره</button>`)}
function saveTx(t){const a=num($('#fa').value);if(a<=0){toast('مبلغ را وارد کنید');return}
 S.tx.push({id:uid(),t,a,c:$('#fc').value,acc:+$('#fb').value,d:$('#fd').value||today(),n:$('#fn').value.trim()});save();closeSh();render();toast('ذخیره شد')}
const delTx=id=>{S.tx=S.tx.filter(t=>t.id!=id);save();render()};
function accForm(){sheet('حساب جدید',`<label>نام حساب</label><input id="an" placeholder="مثلاً کارت ملی"><label>موجودی اولیه (${U()})</label><input id="ab" inputmode="numeric" placeholder="۰"><button class="pri" onclick="saveAcc()">ذخیره</button>`)}
function saveAcc(){const n=$('#an').value.trim();if(!n){toast('نام حساب را وارد کنید');return}S.acc.push({id:uid(),n,b:num($('#ab').value)});save();closeSh();render()}
function delAcc(id){S.acc=S.acc.filter(a=>a.id!=id);S.tx=S.tx.filter(t=>t.acc!=id);save();render()}
function pForm(){sheet('شخص جدید',`<label>نام</label><input id="pn"><button class="pri" onclick="savP()">ذخیره</button>`)}
function savP(){const n=$('#pn').value.trim();if(!n){toast('نام را وارد کنید');return}S.ppl.push({id:uid(),n});save();closeSh();render()}
function pSheet(id){const p=S.ppl.find(x=>x.id==id),b=pBal(p),h=S.pt.filter(x=>x.p==id).sort((a,c)=>c.d.localeCompare(a.d));
 sheet(esc(p.n),`<div class="card"><div class="row"><div><b>${b>0?'بدهکار به شما':b<0?'طلبکار از شما':'تسویه'}</b></div><span class="amt ${b>0?'in':b<0?'out':''}">${f(b)} ${U()}</span></div></div>
 <label>مبلغ</label><input id="pa" inputmode="numeric" placeholder="۰"><label>توضیح</label><input id="pm" placeholder="اختیاری">
 <div class="dual"><button class="pri" onclick="pAdd(${id},'give')">به او دادم</button><button class="pri" style="background:var(--out)" onclick="pAdd(${id},'take')">از او گرفتم</button></div>
 <div class="card" style="margin-top:12px">${h.map(x=>`<div class="row"><div><b>${x.t=='give'?'دادم':'گرفتم'}</b><small>${D(x.d)}${x.n?' – '+esc(x.n):''}</small></div><span class="amt ${x.t=='give'?'in':'out'}">${f(x.a)}</span><button class="x" onclick="pDel(${id},${x.id})">×</button></div>`).join('')||'<div class="empty">سابقه‌ای نیست</div>'}</div>
 <h2>گوشی‌ها</h2><div class="card">${(p.ph||[]).map(x=>`<div class="row"><div><b>${esc(x.m||'گوشی')}</b><small>سریال: <span dir="ltr">${esc(x.s)}</span></small><small>کد فعال‌سازی: <span dir="ltr">${esc(x.c||'—')}</span></small></div><button class="x" style="font-size:13px" onclick="phCp(${id},${x.id})">کپی</button><button class="x" onclick="phDel(${id},${x.id})">×</button></div>`).join('')||'<div class="empty">گوشی‌ای ثبت نشده</div>'}</div><button class="sec" onclick="phForm(${id})">افزودن گوشی</button>
 <h2>اسناد و فیش‌ها</h2><div class="card">${(p.dc||[]).map(x=>`<div class="row" onclick="dcView(${id},${x.id})"><div><b>${esc(x.t)}</b><small>${D(x.d)}${x.img?' – دارای عکس':''}</small></div>${x.a?`<span class="amt">${f(x.a)}</span>`:''}</div>`).join('')||'<div class="empty">سندی ثبت نشده</div>'}</div><button class="sec" onclick="dcForm(${id})">افزودن سند یا فیش</button>
 <button class="sec" style="color:var(--out);margin-top:14px" onclick="ask('این شخص و سوابقش حذف شود؟','pRm(${id})')">حذف شخص</button>`)}
function pAdd(id,t){const a=num($('#pa').value);if(a<=0){toast('مبلغ را وارد کنید');return}S.pt.push({id:uid(),p:id,t,a,d:today(),n:$('#pm').value.trim()});save();render();pSheet(id)}
function pDel(id,x){S.pt=S.pt.filter(t=>t.id!=x);save();render();pSheet(id)}
function pRm(id){S.ppl=S.ppl.filter(p=>p.id!=id);S.pt=S.pt.filter(t=>t.p!=id);save();render()}
const P=id=>S.ppl.find(x=>x.id==id);
function phForm(id){sheet('گوشی جدید',`<label>مدل گوشی</label><input id="phm" placeholder="مثلاً iPhone 15"><label>سریال (IMEI یا Serial)</label><input id="phs" dir="ltr" autocapitalize="characters"><label>کد فعال‌سازی</label><input id="phc" dir="ltr"><div class="dual"><button class="sec" onclick="pSheet(${id})">بازگشت</button><button class="pri" onclick="savPh(${id})">ذخیره</button></div>`)}
function savPh(id){const s=$('#phs').value.trim();if(!s){toast('سریال را وارد کنید');return}const p=P(id);(p.ph=p.ph||[]).push({id:uid(),m:$('#phm').value.trim(),s,c:$('#phc').value.trim()});save();pSheet(id);toast('ذخیره شد')}
function phDel(id,x){const p=P(id);p.ph=p.ph.filter(h=>h.id!=x);save();pSheet(id)}
function phCp(id,x){const h=P(id).ph.find(h=>h.id==x);try{navigator.clipboard.writeText(h.s+(h.c?'\n'+h.c:''));toast('کپی شد')}catch(e){toast('کپی نشد')}}
let img='';
function dcForm(id){img='';sheet('سند یا فیش جدید',`<label>عنوان</label><input id="dt" placeholder="مثلاً فیش واریزی"><label>مبلغ (${U()})</label><input id="da" inputmode="numeric" placeholder="اختیاری"><label>تاریخ</label><input id="dd" type="date" value="${today()}"><label>توضیح</label><input id="dn"><label>عکس سند</label><input id="df" type="file" accept="image/*" onchange="pickImg(this)"><div class="dual"><button class="sec" onclick="pSheet(${id})">بازگشت</button><button class="pri" onclick="savDc(${id})">ذخیره</button></div>`)}
function pickImg(el){const fl=el.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.6);toast('عکس آماده شد')};im.src=r.result};r.readAsDataURL(fl)}
function savDc(id){const t=$('#dt').value.trim();if(!t){toast('عنوان را وارد کنید');return}const p=P(id);(p.dc=p.dc||[]).push({id:uid(),t,a:num($('#da').value),d:$('#dd').value||today(),n:$('#dn').value.trim(),img});save();pSheet(id);toast('ذخیره شد')}
function dcView(id,x){const d=P(id).dc.find(d=>d.id==x);sheet(esc(d.t),`${d.img?`<img src="${d.img}" alt="" style="width:100%;border-radius:10px">`:''}<small>${D(d.d)}${d.a?' – '+f(d.a)+' '+U():''}${d.n?' – '+esc(d.n):''}</small><div class="dual" style="margin-top:10px"><button class="sec" onclick="pSheet(${id})">بازگشت</button><button class="sec" style="color:var(--out)" onclick="dcDel(${id},${x})">حذف</button></div>`)}
function dcDel(id,x){const p=P(id);p.dc=p.dc.filter(d=>d.id!=x);save();pSheet(id)}
function theme(){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('masoud-theme',d.dataset.theme)}catch(e){}}
function bk(){sheet('پشتیبان و بازیابی',`<label>متن زیر را کپی و جایی امن نگه دارید. برای بازیابی، متن پشتیبان را اینجا بچسبانید.</label><textarea id="bt" rows="6" dir="ltr">${esc(JSON.stringify(S))}</textarea><div class="dual"><button class="sec" onclick="try{navigator.clipboard.writeText($('#bt').value);toast('کپی شد')}catch(e){$('#bt').select()}">کپی</button><button class="pri" onclick="rs()">بازیابی</button></div>`)}
function rs(){try{const o=JSON.parse($('#bt').value);if(!o.tx||!o.acc)throw 0;S=o;save();closeSh();render();toast('بازیابی شد')}catch(e){toast('متن پشتیبان معتبر نیست')}}
function reset(){S={tx:[],pt:[],ppl:[],acc:[{id:1,n:'صندوق نقد',b:0},{id:2,n:'حساب بانکی',b:0}],u:'تومان'};save();render()}
$('#lg').src=$('#ai').href=$('#ic').href;
render();
</script>
</body>
</html>
